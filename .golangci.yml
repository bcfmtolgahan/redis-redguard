version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
  settings:
    errcheck:
      # Closing a Redis or Sentinel client only tears down a connection pool:
      # nothing is buffered, so a failure cannot lose a write and no call site
      # can act on it. Every other Close stays checked.
      exclude-functions:
        - (github.com/bcfmtolgahan/redis-redguard/internal/redisclient.Client).Close
        - (*github.com/bcfmtolgahan/redis-redguard/internal/sentinel.SentinelClient).Close
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
      # Test tables repeat Kubernetes literals ("default", "Ready", "redis") in
      # cases that share nothing; a shared constant would tie them together.
      - linters:
          - goconst
        path: _test\.go
      # Fixture helpers take the namespace, replica count and condition name
      # they act on. Today every spec passes the same value; folding it into the
      # helper is what would break the first spec that needs another.
      - linters:
          - unparam
        path: _test\.go
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
