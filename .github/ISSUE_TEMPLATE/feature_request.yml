name: Feature request
description: Something Redguard cannot do yet
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do, and where Redguard stops you.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What the operator should do. A sketch of the API field or CR you have in mind helps.
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: Current workaround
      description: How you handle it today, if at all.
    validations:
      required: false
