name: Release

# A version tag is the only trigger. Never a pull request, never a branch push:
# the jobs below push an image, publish a chart and cut a GitHub release.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

# Publishing is not idempotent: two runs would race the image push and the
# index commit. Never cancel one in flight — a half-published release leaves an
# image without a chart entry.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/bcfmtolgahan/redguard
  PAGES_URL: https://bcfmtolgahan.github.io/redis-redguard

jobs:
  # Runs before anything is published, so a tag that disagrees with the chart
  # does not leave a pushed image behind.
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Verify the chart version matches the tag
        run: |
          chart="$(helm show chart charts/redguard | awk '/^version:/ {print $2}')"
          if [ "$chart" != "${GITHUB_REF_NAME#v}" ]; then
            echo "::error::Chart version $chart does not match tag ${GITHUB_REF_NAME}."
            exit 1
          fi

      # A tag can point at any commit, including one no branch run ever tested,
      # and the chart is generated from config/ rather than written by hand.
      - name: Run the tests, the linter and the chart drift gate
        run: make test lint verify-chart

  image:
    name: Push the multi-arch image
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Derive the image tags
        id: tags
        run: |
          {
            echo "tags<<EOF"
            echo "${IMAGE}:${GITHUB_REF_NAME}"
            # A pre-release tag such as v0.3.0-rc1 must not move :latest.
            case "${GITHUB_REF_NAME}" in
              *-*) ;;
              *) echo "${IMAGE}:latest" ;;
            esac
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # arm64 is emulated on the amd64 runner; the binary is CGO-free static Go,
      # so only the compiler runs under emulation.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The builder image has to satisfy go.mod's directive, and a dependency
      # can raise it. Reading it here means the release cannot fail on a pin
      # that a routine dependency bump left behind.
      - name: Read the Go version from go.mod
        id: go
        run: echo "version=$(awk '/^go /{print $2}' go.mod)" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ github.ref_name }}
            GO_VERSION=${{ steps.go.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  release:
    name: Create the GitHub release
    needs: image
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Build the installer manifest
        run: make build-installer IMG="${IMAGE}:${GITHUB_REF_NAME}"

      - name: Package the chart
        run: helm package charts/redguard --destination dist

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--generate-notes --title "${GITHUB_REF_NAME}")
          case "${GITHUB_REF_NAME}" in
            *-*) args+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${args[@]}" \
            dist/install.yaml dist/redguard-*.tgz

  chart:
    name: Publish the chart repository
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Clone the tag
        uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package the chart
        run: helm package charts/redguard --destination "${RUNNER_TEMP}/chart"

      # GitHub Pages serves docs/ on the default branch, so the index lives
      # there and not on a gh-pages branch.
      - name: Clone the branch that serves the chart repository
        uses: actions/checkout@v7
        with:
          ref: main
          path: pages

      - name: Rebuild the repository index
        run: |
          cp pages/docs/index.yaml "${RUNNER_TEMP}/index-before.yaml"
          cp "${RUNNER_TEMP}"/chart/*.tgz pages/docs/
          # --merge keeps the entries of charts published earlier, whose .tgz
          # files are not necessarily still in the directory.
          helm repo index pages/docs --url "${PAGES_URL}" --merge "${RUNNER_TEMP}/index-before.yaml"

      - name: Check the index before committing it
        run: |
          version="${GITHUB_REF_NAME#v}"
          if ! grep -q "redguard-${version}.tgz" pages/docs/index.yaml; then
            echo "::error::The rebuilt index has no entry for redguard ${version}."
            exit 1
          fi
          # 'helm repo index' regenerates an entry for every .tgz in the
          # directory from that tarball's own Chart.yaml, and --merge only
          # re-adds entries it did not regenerate. A withdrawn version keeps
          # its deprecation only while its tarball stays out of docs/.
          before="$(grep -c '^ *deprecated: true' "${RUNNER_TEMP}/index-before.yaml" || true)"
          after="$(grep -c '^ *deprecated: true' pages/docs/index.yaml || true)"
          if [ "$after" -lt "$before" ]; then
            echo "::error::The rebuild dropped a deprecation marker ($before -> $after). A withdrawn chart's .tgz is back in docs/."
            exit 1
          fi

      - name: Commit the index
        working-directory: pages
        run: |
          git config user.name bcfmtolgahan
          git config user.email tolgahan@bestcloudfor.me
          git add docs
          if git diff --cached --quiet; then
            echo "chart repository already up to date"
            exit 0
          fi
          git commit -m "chore: publish chart ${GITHUB_REF_NAME}"
          git push origin HEAD:main

  # The install command in README.md and docs/install.md is only true once Pages
  # serves the new index, which it rebuilds asynchronously after the commit
  # above. Run that command against the real repository and fail the release if
  # it does not resolve.
  installable:
    name: Install the published chart
    needs: chart
    runs-on: ubuntu-latest
    steps:
      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Pull the tag's chart from the chart repository
        run: |
          version="${GITHUB_REF_NAME#v}"
          dest="${RUNNER_TEMP}/pull"
          # helm pull writes through a temp file in -d and does not create the
          # directory. Without this the pull fails on every attempt and the loop
          # reports it as "not published yet", so the gate can never pass and
          # says the wrong thing when it fails.
          mkdir -p "$dest"
          helm repo add redguard "${PAGES_URL}"
          for attempt in $(seq 1 40); do
            helm repo update redguard >/dev/null
            if err=$(helm pull redguard/redguard --version "$version" -d "$dest" 2>&1); then
              echo "${PAGES_URL} serves redguard ${version}"
              exit 0
            fi
            # Pages redeploys a few minutes after the index commit, so a missing
            # chart is expected early. Anything else is a real failure and must
            # not be hidden behind the retry.
            case "$err" in
              *"no chart version found"*|*404*|*"not found"*)
                echo "attempt ${attempt}: not published yet" ;;
              *)
                echo "::error::helm pull failed for a reason other than the chart being absent: ${err}"
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::${PAGES_URL} does not serve redguard ${version}, but the docs tell users to install it from there."
          exit 1

      - name: Render the pulled chart
        run: |
          version="${GITHUB_REF_NAME#v}"
          helm template redguard "${RUNNER_TEMP}/pull/redguard-${version}.tgz" > "${RUNNER_TEMP}/rendered.yaml"
          # The chart is only installable if the image it names exists.
          image=$(grep -m1 -oE 'ghcr\.io/[^"]+' "${RUNNER_TEMP}/rendered.yaml")
          echo "chart renders and requests ${image}"
          docker manifest inspect "$image" >/dev/null
