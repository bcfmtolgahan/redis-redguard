name: E2E Tests

# A branch push and its pull request are different refs, so an unrestricted
# push trigger runs the whole matrix twice for every proposed change. Branches
# are covered by the pull_request run; the push trigger exists for what is
# already merged or tagged.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# The matrix triples the cost of a run; a superseded push does not need to
# finish booting three Kubernetes clusters.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-e2e:
    name: Kubernetes ${{ matrix.k8s }}
    runs-on: ubuntu-latest
    env:
      # Pinned, and every node image below is published by this release. An
      # older kind cannot load an image into a node built by a newer one:
      # 'kind load' fails with "unknown containerd config version".
      KIND_VERSION: v0.32.0
    strategy:
      # One version failing is a result about that version, not a reason to stop
      # testing the others.
      fail-fast: false
      matrix:
        include:
          # Oldest minor still in standard support on the managed platforms
          # (EKS, GKE, AKS). This is the floor the operator claims to run on.
          - k8s: "1.33"
            node-image: kindest/node:v1.33.12
          # Matches k8s.io/api v0.34.x, which the operator is compiled against
          # and which the envtest control plane of the unit suite runs.
          - k8s: "1.34"
            node-image: kindest/node:v1.34.8
          # Newest node image kind publishes, so removed APIs and tightened
          # admission defaults surface here before a user hits them.
          - k8s: "1.36"
            node-image: kindest/node:v1.36.1
    steps:
      - name: Clone the code
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Install kind
        run: |
          curl -Lo ./kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-$(go env GOARCH)"
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Verify kind installation
        run: kind version

      # The suite installs the operator from charts/redguard, the path a user
      # follows, so helm has to be present and not left to the runner image.
      - name: Install Helm
        uses: azure/setup-helm@v4

      # make test-e2e creates, owns and deletes a cluster of its own, with its
      # own kubeconfig. Nothing here may create a cluster or set KUBECONFIG.
      - name: Running Test e2e
        env:
          KIND_NODE_IMAGE: ${{ matrix.node-image }}
        run: make test-e2e
