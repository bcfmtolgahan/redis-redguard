  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- apiGroups:
  - redis.redguard.io
  resources:
  - redisbackups/finalizers
  - redisrestores/finalizers
  - redissentinels/finalizers
  - redisusers/finalizers
