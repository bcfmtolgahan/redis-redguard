# TLS clusters do not currently reach Running: see docs/operations.md#tls.
#
# One Secret holds the server certificate, its key and the CA. Naming a
# separate Secret in caSecretRef mounts ca.crt with a subPath inside the
# certificate volume, which the container runtime refuses.
#
# kubectl create secret generic redis-tls-bundle \
#   --from-file=tls.crt=tls.crt --from-file=tls.key=tls.key --from-file=ca.crt=ca.crt
apiVersion: redis.redguard.io/v1alpha1
kind: RedisSentinel
metadata:
  name: redis-cluster-tls
  namespace: default
spec:
  redisConfig:
    replicas: 3
    image: redis:7-alpine
    auth:
      secretName: redis-password
    storage:
      size: 1Gi
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  sentinelConfig:
    replicas: 3
    quorum: 2
    downAfterMilliseconds: 5000
    failoverTimeout: 10000
    parallelSyncs: 1

  tls:
    enabled: true
    certificateSecretRef: redis-tls-bundle
    caSecretRef: redis-tls-bundle
    # Requires clients to present a certificate (tls-auth-clients yes).
    mutualTLS: false

  serviceType: ClusterIP
