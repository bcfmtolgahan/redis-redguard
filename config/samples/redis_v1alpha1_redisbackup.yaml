# kubectl create secret generic aws-s3-creds \
#   --from-literal=accessKeyId=AKIA... --from-literal=secretAccessKey=...
apiVersion: redis.redguard.io/v1alpha1
kind: RedisBackup
metadata:
  name: redis-daily-backup
  namespace: default
spec:
  # A RedisSentinel in this namespace. It is part of the object key.
  redisClusterRef: redis-cluster

  # Five-field cron, optionally prefixed TZ= or CRON_TZ=. Descriptors such as
  # @daily are not accepted. Omit for a one-time backup.
  schedule: "0 2 * * *"

  s3:
    bucket: my-redis-backups
    region: us-east-1

    # S3-compatible endpoint, for example MinIO or a VPC endpoint.
    # endpoint: http://minio.minio.svc.cluster.local:9000

    # Objects land at <prefix>/<namespace>/<cluster>/backup-<timestamp>.rdb[.gz].
    prefix: production

    # Exactly one of credentialsSecretRef and useIAMRole. The Secret holds
    # accessKeyId and secretAccessKey.
    credentialsSecretRef: aws-s3-creds

  # Backups of this cluster to keep. 0 keeps every backup. Pruning only ever
  # deletes objects this controller wrote under the prefix above.
  retentionPolicy: 7

  compression: true
  suspend: false
---
# IAM-role backup (IRSA on EKS). The request runs under the operator's own AWS
# identity, so the bucket must be in its --allowed-backup-buckets and any custom
# endpoint in --allowed-backup-endpoints, or the backup is refused with
# DestinationNotAllowed.
apiVersion: redis.redguard.io/v1alpha1
kind: RedisBackup
metadata:
  name: redis-onetime-backup
  namespace: default
spec:
  redisClusterRef: redis-cluster
  # No schedule: runs once.
  s3:
    bucket: my-redis-backups
    region: us-east-1
    prefix: manual
    useIAMRole: true
  retentionPolicy: 30
  compression: true
