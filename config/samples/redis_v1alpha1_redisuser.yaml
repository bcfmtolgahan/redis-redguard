# kubectl create secret generic app-user-password --from-literal=password='...'
apiVersion: redis.redguard.io/v1alpha1
kind: RedisUser
metadata:
  name: app-user
  namespace: default
spec:
  # A RedisSentinel in this namespace. The user is written to every ready node.
  redisClusterRef: redis-cluster

  # "default" is reserved: it is the admin account whose password is requirepass.
  username: app-user

  # Secret in this namespace holding the password under the key "password".
  passwordSecretRef: app-user-password

  # Nothing is granted implicitly. A user with no rules reaches no key, channel
  # or command. Grants are allowlisted and narrowed by a confinement floor;
  # see docs/security.md.
  aclRules:
    # Data categories only. +@all, +@admin and +@dangerous are refused.
    categories:
      - "+@read"
      - "+@write"
    # Individual commands must carry a key specification, so ~patterns confine
    # them. +keys and +scan are refused; a negation is always accepted.
    commands:
      - "+get"
      - "+set"
      - "+del"
      - "-flushdb"
    # Key patterns this user may reach.
    keys:
      - "~app:*"
      - "~cache:*"
    # Pub/Sub channel patterns.
    channels:
      - "&notifications:*"

  # false keeps the rules but rejects every AUTH for this user.
  enabled: true
