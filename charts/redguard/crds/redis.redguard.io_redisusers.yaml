---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: redisusers.redis.redguard.io
spec:
  group: redis.redguard.io
  names:
    kind: RedisUser
    listKind: RedisUserList
    plural: redisusers
    singular: redisuser
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.username
      name: Username
      type: string
    - jsonPath: .spec.redisClusterRef
      name: Cluster
      type: string
    - jsonPath: .spec.enabled
      name: Enabled
      type: boolean
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RedisUser is the Schema for the redisusers API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RedisUser
            properties:
              aclRules:
                description: |-
                  ACLRules define the permissions for this user. Nothing is granted
                  implicitly: a user with no rules can authenticate and reach no key,
                  channel or command.
                properties:
                  categories:
                    description: Categories are ACL categories (+@read, +@write, etc.)
                    items:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[^\s()]+$
                      type: string
                    type: array
                  channels:
                    description: Channels are pub/sub channel patterns (&*, &notifications:*,
                      etc.)
                    items:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[^\s()]+$
                      type: string
                    type: array
                  commands:
                    description: Commands are allowed Redis commands (+get, +set,
                      -del, etc.)
                    items:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[^\s()]+$
                      type: string
                    type: array
                  keys:
                    description: Keys are key patterns this user can access (~*, ~app:*,
                      etc.)
                    items:
                      maxLength: 128
                      minLength: 1
                      pattern: ^[^\s()]+$
                      type: string
                    type: array
                type: object
              enabled:
                default: true
                description: |-
                  Enabled indicates whether the user may authenticate. A disabled user
                  keeps its rules but every AUTH for it is rejected.
                type: boolean
              passwordSecretRef:
                description: |-
                  PasswordSecretRef names a Secret in this RedisUser's own namespace holding
                  this user's password under the key "password". The name is resolved
                  verbatim, so it must be a DNS-1123 subdomain.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              redisClusterRef:
                description: RedisClusterRef references the RedisSentinel instance
                type: string
              username:
                description: |-
                  Username is the Redis ACL username. The name "default" is reserved: it
                  is the admin account whose password is requirepass, and redefining it
                  would reset the cluster password.
                maxLength: 64
                minLength: 1
                pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]*$
                type: string
                x-kubernetes-validations:
                - message: username 'default' is reserved for the Redis admin account
                  rule: self != 'default'
            required:
            - passwordSecretRef
            - redisClusterRef
            - username
            type: object
          status:
            description: status defines the observed state of RedisUser
            properties:
              appliedTo:
                description: AppliedTo tracks which Redis instances have this user
                  configured
                items:
                  type: string
                type: array
              conditions:
                description: Conditions represent the current state of the RedisUser
                  resource.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
