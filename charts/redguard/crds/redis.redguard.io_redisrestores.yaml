---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: redisrestores.redis.redguard.io
spec:
  group: redis.redguard.io
  names:
    kind: RedisRestore
    listKind: RedisRestoreList
    plural: redisrestores
    singular: redisrestore
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.redisClusterRef
      name: Cluster
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.duration
      name: Duration
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: RedisRestore is the Schema for the redisrestores API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of RedisRestore
            properties:
              backupSource:
                description: BackupSource defines where to restore from
                properties:
                  backupPath:
                    description: |-
                      BackupPath is the full S3 path to the backup file
                      Example: "backups/myredis/backup-20240101-120000.rdb.gz"
                    type: string
                  compressed:
                    default: true
                    description: Compressed indicates if the backup is gzip compressed
                    type: boolean
                  s3:
                    description: S3 defines S3 storage configuration
                    properties:
                      bucket:
                        description: Bucket is the S3 bucket name
                        type: string
                      credentialsSecretRef:
                        description: |-
                          CredentialsSecretRef names a Secret in the referring CR's own namespace
                          holding "accessKeyId" and "secretAccessKey". The name is resolved
                          verbatim, so it must be a DNS-1123 subdomain.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                      endpoint:
                        description: Endpoint is the S3-compatible endpoint (for MinIO,
                          etc.)
                        type: string
                      prefix:
                        description: |-
                          Prefix is the path prefix for backups. RedisBackup writes objects
                          under <prefix>/<namespace>/<clusterName>/<backupName>/ and retention
                          only ever deletes objects under that exact prefix, so two RedisBackups
                          for one cluster never prune each other's objects.
                        type: string
                      region:
                        description: Region is the AWS region
                        type: string
                      useIAMRole:
                        description: |-
                          UseIAMRole indicates whether to use IAM role instead of credentials.
                          The request then runs under the operator's own AWS identity; both
                          RedisBackup and RedisRestore reject destinations whose bucket is not
                          listed in the operator's --allowed-backup-buckets or whose custom
                          endpoint is not in --allowed-backup-endpoints.
                        type: boolean
                    required:
                    - bucket
                    type: object
                    x-kubernetes-validations:
                    - message: 'exactly one of s3.credentialsSecretRef or s3.useIAMRole
                        must be set: with neither, the AWS SDK signs the request with
                        whatever ambient identity the operator pod carries and never
                        passes the destination allowlist; with both, the Secret wins
                        and useIAMRole says nothing about which identity signed'
                      rule: has(self.credentialsSecretRef) != (has(self.useIAMRole)
                        && self.useIAMRole)
                required:
                - backupPath
                - s3
                type: object
              force:
                description: |-
                  Force allows restore even if the cluster has existing data
                  WARNING: This will overwrite existing data!
                type: boolean
              redisClusterRef:
                description: |-
                  RedisClusterRef is the name of a RedisSentinel in this RedisRestore's own
                  namespace. It is resolved verbatim, so it must be a DNS-1123 subdomain.
                maxLength: 253
                minLength: 1
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                type: string
              skipDataCheck:
                description: |-
                  SkipDataCheck skips the check for existing data before restore
                  Use with caution as it may cause data loss
                type: boolean
            required:
            - backupSource
            - redisClusterRef
            type: object
          status:
            description: status defines the observed state of RedisRestore
            properties:
              completionTime:
                description: CompletionTime is when the restore operation completed
                format: date-time
                type: string
              conditions:
                description: Conditions represent the current state of the RedisRestore
                  resource
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              datasetReplaced:
                description: |-
                  DatasetReplaced is set once the master has restarted and consumed the
                  restore payload: from that point the cluster serves the restored data,
                  even if the restore later fails, so a Failed phase with this set means
                  the previous dataset is gone.
                type: boolean
              duration:
                description: Duration is the total duration of the restore operation
                type: string
              expectedKeyCount:
                description: |-
                  ExpectedKeyCount is the key count the source RedisBackup recorded for
                  the restored object; zero when no backup in the namespace records it.
                  The backup counts after BGSAVE completes, so a cluster taking writes
                  drifts from the snapshot: a mismatch with restoredKeyCount is advisory.
                format: int64
                type: integer
              message:
                description: Message provides additional information about the current
                  state
                type: string
              observedGeneration:
                description: |-
                  ObservedGeneration is the spec generation the recorded phase applies to.
                  A Completed or Failed restore re-runs only when the spec changes.
                format: int64
                type: integer
              phase:
                description: Phase represents the current phase of the restore operation
                type: string
              quiescedDownAfterMilliseconds:
                description: |-
                  QuiescedDownAfterMilliseconds records the sentinel down-after-milliseconds
                  value to restore once the master restart is over; zero means the sentinels
                  are not quiesced by this restore.
                format: int32
                type: integer
              restoredDataSize:
                description: RestoredDataSize is the size of the restored data in
                  bytes
                format: int64
                type: integer
              restoredFrom:
                description: RestoredFrom contains the backup path that was restored
                type: string
              restoredKeyCount:
                description: |-
                  RestoredKeyCount is the key count observed across all databases after
                  the restored dataset was loaded.
                format: int64
                type: integer
              startTime:
                description: StartTime is when the restore operation started
                format: date-time
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
